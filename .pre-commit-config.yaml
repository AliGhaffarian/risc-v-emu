repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: (^build/.*$)|(.*\.md)
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.1
    hooks:
      - id: clang-format
        args: [-style=file]
        exclude: ^build/.*$
        files: \.(c|h)$
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        exclude: .*\.svg|^build/.*$|.*\.drawio
        args: [-w]
  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.14.2
    hooks:
      - id: markdown-link-check
        args: [-q]
        exclude: ^build/.*$
        repos:
  - repo: local
    hooks:
      - id: cmake-build-test
        name: CMake Build & CTest
        entry: ./scripts/build_and_test.sh
        language: system
        pass_filenames: false
        always_run: true
        files: \.(c|cpp|cc|cxx|h|hpp|hxx|CMakeLists\.txt)$
